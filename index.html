<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Pro Portfolio</title>
    <meta name="description" content="A professional video editor portfolio designed with high-fidelity editing interface aesthetics, featuring an interactive project timeline, media bin gallery, and preview monitor hero." />
    <meta property="og:title" content="Timeline Pro Portfolio" />
    <meta property="og:description" content="A professional video editor portfolio designed with high-fidelity editing interface aesthetics, featuring an interactive project timeline, media bin gallery, and preview monitor hero." />
    <script>
      (function() {
        // Prevent failing Vite HMR WebSocket connection in AI Studio sandbox
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteHMRMockWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'))) {
              const listeners = {};
              return {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                url: url,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteHMRMockWebSocket.prototype = NativeWebSocket.prototype;
          ViteHMRMockWebSocket.CONNECTING = 0;
          ViteHMRMockWebSocket.OPEN = 1;
          ViteHMRMockWebSocket.CLOSING = 2;
          ViteHMRMockWebSocket.CLOSED = 3;
          window.WebSocket = ViteHMRMockWebSocket;
        }

        // Global fallback error suppressor
        window.addEventListener('unhandledrejection', function(event) {
          if (
            event?.reason?.message?.includes('WebSocket') ||
            event?.reason?.stack?.includes('@vite/client') ||
            event?.reason?.stack?.includes('createWebSocketModuleRunnerTransport')
          ) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (
            event?.message?.includes('WebSocket') ||
            event?.filename?.includes('@vite/client')
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
